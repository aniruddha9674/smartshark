name: Domain Discovery

on:
  schedule:
    # Every 6 hours — gives the previous run time to finish
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allow manual trigger from the Actions tab

jobs:
  discover:
    name: Domain Discovery Batch
    runs-on: ubuntu-latest
    timeout-minutes: 350  # 5h50m — safely under the 6h limit

    defaults:
      run:
        working-directory: ./virtual-shark-tank/server

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: virtual-shark-tank/server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run domain discovery
        env:
          POSTGRES_URI: ${{ secrets.POSTGRES_URI }}
          MAX_TIER: '5000'
          CONCURRENCY: '3'
        run: node scripts/discover-cascade.js