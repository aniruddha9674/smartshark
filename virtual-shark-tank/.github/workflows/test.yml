name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Run test suite
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./server

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci
        env:
          MONGOMS_DISABLE_POSTINSTALL: '1'

      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test
          PORT: 5000
          POSTGRES_URI: postgresql://ci:ci@localhost:5432/ci
          MONGO_URI: mongodb://localhost:27017/ci
          JWT_SECRET: ci-secret-not-used-anywhere-real
          JWT_REFRESH_SECRET: ci-refresh-secret-not-used-anywhere-real